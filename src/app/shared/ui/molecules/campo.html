<div class="campo">
  <label [for]="controlId()">{{ etiqueta() }}</label>
  <ng-content />
  @if (ayuda()) {
    <small class="ayuda" [id]="controlId() + '-ayuda'">{{ ayuda() }}</small>
  }
  <small class="error-campo" aria-live="polite" [id]="controlId() + '-error'">{{
    error()
  }}</small>
</div>
